name: Deploy Supabase (migraciones + Edge Functions)

# Al mergear en main algo que toque supabase/, aplica las migraciones nuevas y despliega las
# Edge Functions en tu proyecto de Supabase en la NUBE.
#
# INACTIVO hasta que añadas estos secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  → https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   → el id del proyecto (lo ves en la URL del dashboard)
#   SUPABASE_DB_PASSWORD   → la contraseña de la base que elegiste al crear el proyecto
# Sin ellos este workflow termina en verde sin hacer nada. Guía: docs/graduacion/01-nube-github-y-ci.md

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: ¿Está configurado?
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Faltan secrets de Supabase → no se despliega (no-op verde)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.enabled == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.enabled == 'true'
        with:
          version: latest

      - name: Enlazar proyecto
        if: steps.guard.outputs.enabled == 'true'
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Aplicar migraciones
        if: steps.guard.outputs.enabled == 'true'
        run: supabase db push

      - name: Desplegar Edge Functions
        if: steps.guard.outputs.enabled == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
